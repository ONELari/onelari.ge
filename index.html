<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE Lari</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0d0d0d; --card-bg: #141414; --accent-color: #e5a93c; --text-color: #ffffff; --text-muted: #888888; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        header { max-width: 1200px; margin: 0 auto 40px auto; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 40px; width: auto; }
        .logo-text { font-weight: 700; font-size: 24px; }
        .logo-text span { color: var(--accent-color); }
        .languages { display: flex; gap: 15px; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; padding-bottom: 2px; }
        .lang-btn.active { color: var(--text-color); border-bottom: 2px solid var(--accent-color); }
        main { max-width: 1200px; margin: 0 auto; }
        .lang-section { display: none; }
        .lang-section.active { display: block; }
        .section-header { margin-bottom: 30px; margin-top: 40px; }
        .section-header h2 { font-size: 20px; text-transform: uppercase; color: var(--accent-color); }
        .grid-popular { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 30px; }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; }
        .card-image { width: 100%; height: 240px; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 20px; }
        .btn-order { display: block; background-color: var(--accent-color); color: #000; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-top: 15px; }
        .coffee-block { background-color: var(--card-bg); padding: 20px; border-radius: 12px; }
        .btn-map { display: inline-block; background: #222; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="logo-text">ONE <span>LARI</span></div>
        </div>
        <div class="languages">
            <button class="lang-btn active" onclick="setLanguage('en', event)">ENG</button>
            <button class="lang-btn" onclick="setLanguage('ka', event)">GEO</button>
            <button class="lang-btn" onclick="setLanguage('ru', event)">RUS</button>
        </div>
    </header>

    <main>
        <div id="content-en" class="lang-section active">
            <section>
                <div class="section-header"><h2>Popular</h2></div>
                <div class="grid-popular">
                    <div class="card">
                        <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=22941803779&externalProductId=83" target="_blank"><img src="dozen-choco.png" style="width:100%"></a>
                        <div class="card-content"><h3>Pancakes "Dozen"</h3><a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=22941803779&externalProductId=83" class="btn-order" target="_blank">Order</a></div>
                    </div>
                    <div class="card">
                        <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=33198094944&externalProductId=f6c37c20-9d19-42f8-a71d-ff158a3ea6ca" target="_blank"><img src="chicken-cheese-combo.jpg" style="width:100%"></a>
                        <div class="card-content"><h3>Combo Chicken-Cheese</h3><a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=33198094944&externalProductId=f6c37c20-9d19-42f8-a71d-ff158a3ea6ca" class="btn-order" target="_blank">Order</a></div>
                    </div>
                </div>
            </section>
        </div>

        <div id="content-ka" class="lang-section">
            <section>
                <div class="section-header"><h2>პოპულარული</h2></div>
                </section>
        </div>

        <div id="content-ru" class="lang-section">
            <section>
                <div class="section-header"><h2>Популярное</h2></div>
                </section>
        </div>
    </main>

    <script>
        function setLanguage(lang, event) {
            document.querySelectorAll('.lang-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('content-' + lang).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
