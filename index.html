<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE Lari</title>
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Arial', sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; padding-bottom: 20px; }
        .lang-btn { background: #333; color: #fff; border: none; padding: 5px 12px; cursor: pointer; border-radius: 4px; margin-left: 5px; }
        .lang-btn.active { background: #e5a93c; color: #000; font-weight: bold; }
        main { max-width: 1000px; margin: 0 auto; }
        .lang-section { display: none; }
        .lang-section.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #141414; padding: 20px; border-radius: 12px; display: flex; flex-direction: column; }
        .btn-order { display: block; background: #e5a93c; color: #000; text-align: center; padding: 12px; text-decoration: none; font-weight: bold; margin-top: auto; border-radius: 6px; }
    </style>
</head>
<body>

<header>
    <h1>ONE Lari</h1>
    <div>
        <button class="lang-btn active" onclick="show('en')">ENG</button>
        <button class="lang-btn" onclick="show('ka')">GEO</button>
        <button class="lang-btn" onclick="show('ru')">RUS</button>
    </div>
</header>

<main>
    <div id="en" class="lang-section active">
        <h2>Popular</h2>
        <div class="grid">
            <div class="card">
                <h3>Pancakes "Dozen"</h3>
                <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=22941803779&externalProductId=83" class="btn-order">Order via Glovo</a>
            </div>
            <div class="card">
                <h3>Combo Chicken-Cheese</h3>
                <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=33198094944&externalProductId=f6c37c20-9d19-42f8-a71d-ff158a3ea6ca" class="btn-order">Order via Glovo</a>
            </div>
        </div>
    </div>

    <div id="ka" class="lang-section">
        <h2>პოპულარული</h2>
        <div class="grid">
            <div class="card">
                <h3>პანკეიკები "Dozen"</h3>
                <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=22941803779&externalProductId=83" class="btn-order">შეუკვეთეთ Glovo-ით</a>
            </div>
            <div class="card">
                <h3>კომბო ქათმით და ყველით</h3>
                <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=33198094944&externalProductId=f6c37c20-9d19-42f8-a71d-ff158a3ea6ca" class="btn-order">შეუკვეთეთ Glovo-ით</a>
            </div>
        </div>
    </div>

    <div id="ru" class="lang-section">
        <h2>Популярное</h2>
        <div class="grid">
            <div class="card">
                <h3>Панкейки "Дюжина"</h3>
                <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=22941803779&externalProductId=83" class="btn-order">Заказать через Glovo</a>
            </div>
            <div class="card">
                <h3>Комбо Курица-Сыр</h3>
                <a href="https://glovoapp.com/ru/ge/batumi/stores/one-lari-bat?content=samoe-populyarnoe-ts&productId=33198094944&externalProductId=f6c37c20-9d19-42f8-a71d-ff158a3ea6ca" class="btn-order">Заказать через Glovo</a>
            </div>
        </div>
    </div>
</main>

<script>
    function show(lang) {
        document.querySelectorAll('.lang-section').forEach(s => s.classList.remove('active'));
        document.getElementById(lang).classList.add('active');
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
    }
</script>

</body>
</html>
