<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE Lari</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #141414;
            --accent-color: #e5a93c;
            --text-color: #ffffff;
            --text-muted: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }

        header { max-width: 1200px; margin: 0 auto 40px auto; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-img { height: 40px; width: auto; }
        .logo-text { font-weight: 700; font-size: 24px; letter-spacing: 1px; }
        .logo-text span { color: var(--accent-color); }
        .languages { display: flex; gap: 15px; }
        .lang-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer; padding-bottom: 2px; }
        .lang-btn.active { color: var(--text-color); border-bottom: 2px solid var(--accent-color); }

        main { max-width: 1200px; margin: 0 auto; }
        .lang-section { display: none; }
        .lang-section.active { display: block; }

        .section-header { margin-bottom: 30px; }
        .section-header h2 { font-size: 20px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; position: relative; display: inline-block; }
        .section-header h2::after { content: ''; position: absolute; left: 0; bottom: -5px; width: 40px; height: 2px; background-color: var(--accent-color); }
        .section-desc { color: var(--text-muted); font-size: 14px; max-width: 600px; line-height: 1.6; margin-bottom: 30px; }

        .grid-popular { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .card-link { text-decoration: none; color: inherit; display: block; }
        .card-image { position: relative; width: 100%; height: 240px; background-color: #222; cursor: pointer; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .badge-delivery { position: absolute; top: 15px; left: 15px; background-color: #ff4a4a; color: white; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; z-index: 2; }
        .badge-price { position: absolute; top: 15px; right: 15px; background-color: rgba(0,0,0,0.7); color: var(--accent-color); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--accent-color); z-index: 2; }
        .card-content { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; cursor: pointer; }
        .card-list { list-style: none; margin-bottom: 25px; flex-grow: 1; }
        .card-list li { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; }
        .card-list li::before { content: '✓'; color: var(--accent-color); margin-right: 10px; font-weight: bold; }
        .btn-order { display: block; background-color: var(--accent-color); color: #000; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; }

        .coffee-block-link { text-decoration: none; color: inherit; display: block; margin-bottom: 60px; }
        .coffee-block { background-color: var(--card-bg); border-radius: 12px; padding: 30px; }
        .coffee-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px 40px; }
        .coffee-item { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; }
        .coffee-name { font-size: 14px; font-weight: 600; }
        .coffee-price { font-size: 14px; font-weight: 700; color: var(--accent-color); }

        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .info-card { background-color: var(--card-bg); border-radius: 12px; padding: 30px; text-align: center; }
        .btn-map { display: inline-block; margin-top: 15px; background-color: #222; color: var(--text-color); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 12px; border: 1px solid #333; }
