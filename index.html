<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE Lari | Batumi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Шапка с переключателем языков */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #262626;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .logo span {
            color: #ff9900;
        }
        .lang-switcher {
            display: flex;
            gap: 10px;
        }
        .lang-btn {
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn.active {
            background: #ff9900;
            color: #000000;
            border-color: #ff9900;
        }
        
        /* Скрытие языковых блоков */
        .lang-section {
            display: none;
        }
        .lang-section.active {
            display: block;
        }

        /* Стили контента */
        .lang-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 4px solid #ff9900;
            padding-left: 15px;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #e60000;
            color: #ffffff;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(230,0,0,0.4);
        }
        .img-container {
            position: relative;
            width: 100%;
            height: 250px;
            background: #262626;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .price {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff9900;
            color: #000000;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .card-text {
            font-size: 13px;
            color: #a6a6a6;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .btn-order {
            background: #ff9900;
            color: #000000;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s;
            display: block;
            box-shadow: 0 4px 12px rgba(255, 153, 0, 0.2);
        }
        .info-box {
            background-color: #1a1a1a;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 800px;
            margin: 20px auto;
        }
        .info-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
        }
        .info-card {
            background: #262626;
            padding: 20px;
            border-radius: 8px;
            min-width: 250px;
            flex: 1;
        }
        .btn-map {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ff9900;
            color: #000000;
            text-decoration: none;
            padding: 15px 35px;
            font-weight: 700;
            font-size: 16px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
        }
